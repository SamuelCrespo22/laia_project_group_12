services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: flight-delay-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: flight-delay-mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlartifacts --host 0.0.0.0 --port 5000
    volumes:
      - mlflow-data:/mlartifacts

  prometheus:
    image: prom/prometheus:latest
    container_name: flight-delay-prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: flight-delay-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mlflow-data:

