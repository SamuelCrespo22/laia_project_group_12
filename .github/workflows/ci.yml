name: CI

on:
  push:
  pull_request:

jobs:
  quality-tests-and-builds:
    name: Quality checks, tests, and Docker builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install flake8 black isort pytest pytest-cov
          fi

      - name: Run flake8
        run: |
          flake8 .

      - name: Check formatting with black
        run: |
          black --check .

      - name: Check import order with isort
        run: |
          isort --check-only .

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build serving Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.serving
          push: false
          tags: local/serving:${{ github.sha }}

      - name: Build training Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.training
          push: false
          tags: local/training:${{ github.sha }}