
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: flight-delay-serving:dev
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_PATH: /app/models/model.joblib
      MODEL_VERSION: ${MODEL_VERSION:-local}
    volumes:
      - ../models:/app/models:ro
    depends_on:
      mlflow:
        condition: service_started
    restart: unless-stopped
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    ports:
      - "5000:5000"
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped


  training:
    profiles:
      - training
    build:
      context: ..
      dockerfile: docker/Dockerfile.train
    image: flight-delay-training:dev
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_COMMIT: ${GIT_COMMIT:-}
    volumes:
      - ../data:/app/data:ro
      - ../models:/app/models
      - ../reports:/app/reports
    depends_on:
      mlflow:
        condition: service_started

volumes:
  mlflow-data:
