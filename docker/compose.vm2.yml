# DEI VM 2: inference API, using the image published by the CD workflow,
# with Prometheus (port 9090) and Grafana (port 3000) monitoring it.
# IMAGE_TAG is the full commit SHA of a commit on main.
services:
  api:
    image: ghcr.io/samuelcrespo22/laia_project_group_12-serving:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA on main}
    ports:
      # The leaderboard reaches VMs on 8080; 8000 is blocked on the DEI network.
      - "8080:8000"
    environment:
      MODEL_PATH: /app/models/model.joblib
      MODEL_VERSION: ${MODEL_VERSION:-unknown}
      TRAFFIC_DIR: /app/logs/traffic
    volumes:
      - /opt/flight-delay/models:/app/models:ro
      # /classify and /labels traffic; must be writable by UID 10001
      - /opt/flight-delay/traffic:/app/logs/traffic
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flight-delay-api.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
